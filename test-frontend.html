<!DOCTYPE html>
<html>
<head>
    <title>Test Backend Connection</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        #result { margin-top: 20px; padding: 10px; border: 1px solid #ccc; min-height: 100px; }
        .success { background: #d4edda; }
        .error { background: #f8d7da; }
    </style>
</head>
<body>
    <h1>Test de Connexion Backend</h1>
    
    <button onclick="testGetCompte()">Test GET Compte</button>
    <button onclick="testCreateCompte()">Test POST Créer Compte</button>
    <button onclick="testTransfer()">Test POST Transfert</button>
    
    <div id="result"></div>

    <script>
        const API_BASE = 'http://localhost:8080/api';
        
        function showResult(message, isError = false) {
            const div = document.getElementById('result');
            div.innerHTML = message;
            div.className = isError ? 'error' : 'success';
        }

        async function testGetCompte() {
            try {
                const response = await fetch(`${API_BASE}/comptes/search/byNumero?numeroCompte=FR7612345678901`);
                const data = await response.json();
                showResult(`✅ GET réussi!<br><pre>${JSON.stringify(data, null, 2)}</pre>`);
            } catch (error) {
                showResult(`❌ Erreur GET: ${error.message}`, true);
            }
        }

        async function testCreateCompte() {
            try {
                const payload = {
                    proprietaire: "Test HTML",
                    numeroCompte: "FR76" + Math.floor(Math.random() * 100000000000),
                    solde: 1000.0,
                    typeCompte: "COURANT"
                };
                
                const response = await fetch(`${API_BASE}/comptes`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const data = await response.json();
                showResult(`✅ POST Compte réussi!<br><pre>${JSON.stringify(data, null, 2)}</pre>`);
            } catch (error) {
                showResult(`❌ Erreur POST Compte: ${error.message}`, true);
            }
        }

        async function testTransfer() {
            try {
                const payload = {
                    compteSourceNumero: "FR7612345678901",
                    compteDestinationNumero: "FR7698765432109",
                    montant: 10.0,
                    typeTransaction: "VIREMENT"
                };
                
                const response = await fetch(`${API_BASE}/transactions/transfert`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const data = await response.json();
                showResult(`✅ POST Transfert réussi!<br><pre>${JSON.stringify(data, null, 2)}</pre>`);
            } catch (error) {
                showResult(`❌ Erreur POST Transfert: ${error.message}`, true);
            }
        }
    </script>
</body>
</html>
