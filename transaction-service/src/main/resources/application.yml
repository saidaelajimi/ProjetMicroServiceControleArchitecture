server:
  port: 8082

spring:
  application:
    name: transaction-service

  datasource:
    url: jdbc:h2:mem:transactiondb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: http://admin:admin123@localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.int}

# Configuration FeignClient
feign:
  httpclient:
    enabled: true
  client:
    config:
      default:
        decode404: false
        encoder: feign.jackson.JacksonEncoder
        decoder: feign.jackson.JacksonDecoder
        contract: feign.jackson.JacksonContract
        connectTimeout: 5000
        readTimeout: 5000
        loggerLevel: full
  circuitbreaker:
    enabled: true

# Configuration Resilience4j (Circuit Breaker)
resilience4j:
  circuitbreaker:
    instances:
      compteService:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10000
        permittedNumberOfCallsInHalfOpenState: 3

logging:
  level:
    com.banking.transaction: DEBUG
    com.banking.transaction.client.CompteClient: DEBUG